apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-service
  namespace: sample
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: sample-service}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sample-service
  namespace: sample
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: sample-service}
