apiVersion: v1
kind: ServiceAccount
metadata:
  name: debugger
  namespace: sample
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: sample
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debugger-pod-reader
  namespace: sample
subjects:
  - {kind: ServiceAccount, name: debugger, namespace: sample}
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
