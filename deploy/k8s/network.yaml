apiVersion: v1
kind: Service
metadata:
  name: sample-service
  namespace: sample
  labels: {app: sample-service}
spec:
  selector: {app: sample-service}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-service
  namespace: sample
spec:
  ingressClassName: traefik
  rules:
    - host: sample.127.0.0.1.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-service
                port: {name: http}
