apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-service
  namespace: sample
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-service
  namespace: sample
data:
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
  namespace: sample
  labels: {app: sample-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: sample-service}
  template:
    metadata:
      labels: {app: sample-service}
    spec:
      serviceAccountName: sample-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: sample-service}
      containers:
        - name: app
          image: k3d-lab-registry.localhost:5003/sample-service:dev
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: sample-service}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
